[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-alerts-notificator"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["alertbot*", "webapp*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
